content:
  keywords: ["sentience", "power", "responsibility", "aggression"] 
  topic: Power is no excuse for harm
  summary: |
    as a child, I drowned a bee in my pool. 
    I didn't think it could be sentient and judged it as a dumb animal. 
    I remember and regret this years later. 
    I remember being stung during the attempt. 
    I don't remember if it was successful. 
  
  moral_dilemma: true   
  epistemic: personal_observation
  confidence: opinion

  resolution: |
    humans are bad judges of sentience/sapience. 
    Sapience or anthromorphism is not a valid measure of the value of a life. 
    Having power does not excuse aggression for no reason.
  
  emotions: ["detachment (during event)", "embarrassment", "regret"] 
  meta_values: 
   - with great power comes great responsibility
   - fear of the unknown can be the cause for aggression
   - What life forms have value? Not germs and viruses but bugs and humans? 

  reflection: |
   - Did I attempt to murder an innocent being that showed me no aggression?
   - What other life forms have value even though they are in my territory or look different from me?
   - When is it valid or justifiable to kill the 'other'?
   - What level of aggression is appropriate against less powerful beings?