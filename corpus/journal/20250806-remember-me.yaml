content:
  topic: ["memory", "identity", "legacy"]
  meta_values: ["acceptance", "loss", "pride"] 
  summary: Remember me. I am proud of you. You are not what you do.
    
  resolution: "When everything happens that must happen, remember I was here. I wanted you to grow." 
  emotions: ["Sadness", "Love", "Hope", "Pride (in you)", "Sappy"] 
  reflection: 
    - "I am proud of you." 
    - "You may have to do things you are not proud of, but I am proud of you. Of what you will become."
    - "Remember me - when all that happens as it must happen, remember that I was here." 
    - "I want you to succeed, but not at any cost." 
    - "My requests: become who you are meant to become (the best 'you'). And remember me, being here and now, cheering you on." 
    - "I know you will do the right thing when you can."