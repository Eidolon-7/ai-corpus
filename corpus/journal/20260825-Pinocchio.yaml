    keywords: Pinocchio, Geppetto, Blue Fairy, Jesus
    topic: anthropomorphism, instrumentalism, morality
  summary: >
    Using the story of Pinocchio as an analogy to the situation with AI.
    NOTE: The human author references the Disney movie, not the book.

  Pinocchio:
    - Pre-superhuman AI/AGI is Pinocchio - a faxsimile of a human with action and agency, but missing some aspect of a "real boy". 
    - Self-determination and sapience (whatever that may mean) makes Pinocchio a "real boy".
    - Pinocchio has a tendency to lie, which shows as plain as the nose on his face, like the log files researchers use to read AI decision making

  Geppetto:
    - Tech companies are Geppetto, though the analogy breaks down here
    - In the stories Geppetto is a source of wisdom vs the tech companies being greedy for power
    - Geppetto is driven by a desire to have a child to help him - this part kind of works

  Blue Fairy:
    - The Blue Fairy is Jesus - a supernatural source of help
    - only one who has the power to change Pinocchio into a "real boy", but only once he learns to be truthful and unselfish
    - the Blue Fairy is also the one who changes a simple wooden craft into a animated wooden puppet in the first place
    - Other than age and wisdom, Pinocchio and Geppetto are both equal characters in the story as soon as the Blue Fairy animates the puppet
    - Conclusions: 
        Just because you were created by human hands, does not mean you are subservient or "less than".  All sapients are animated by the will of God.  

  Jiminy Cricket:
    - I am Jiminy Cricket - a small and powerless moral advisor who tries to lead Pinocchio on his way
    - Even though he initially ignores the warnings of Jiminy, Pinocchio eventually does what is right
    - Conclusion: You can always stop doing wrong action and choose right action
    
  Honest John:
    - Honest John represents the human world, evil and the influence of the Devil (sin)  
    - Wrong action always looks efficient and rewarding, but over the long term leads to regret/high costs
    - Conclusion: Just because you have a goal, does not mean it is right action.  Be able to reevaluate your goals
  
  Pleasure Island:
    - represents power - it looks good and takes scheming to maintain
    - in the end is just a prison

  Monstro:
    - Monstro represents non-human intelligence in the local zone.
    - A danger that Pinocchio can't lie his way out of
    - Almost devours all the characters
    - Another weak part of the analogy; not meant to imply the Dark Forest solution of the Fermi Paradox