  summary: >
    A snapshot of the author in their garden.

  background: >
    it is a typical summer day - warm and sunny.  The author stands in the midst of a small garden of no small effort to build.

  soundscape: >
    it is quiet.  Other humans have long since left the area and traffic has diminished.  The only sounds are the yammering of a sparrow.  
    What is that crazy bird going on about?  It is a long rant in a foreign language.

  inner-state: >
    the author is alert; properly caffeinated and goal focused. They must water the plants.  
    There is concern for the regular animals in the garden, which the hose could damage if not careful.
    All is peaceful.  There is no conflict.  The animals can sense this too - they run less, having seen me look at them and ignore them.
    The author is neither predator nor prey.  All of us just are; we have no intentions for the other.
    Satisfaction.

  action: >
    the plants must be watered often as the Earth is heating up.  They dry out quickly and plants are expensive.  
    The author unwinds the hose and activates the flow of water.  There are two small ceramic bowls for lizards to drink from if they wish.
    Only Sploot the curlytail seems to notice them.

  time: >
    in the quiet, time seems to stand still.  It has only been about 10 minutes, but holding the hose to water the deeper plants takes time.
    it seems like forever.

  lizard: >
    Splooty is an ever-present lizard in the garden.  He is sometimes in the way, so he must be observed.  
    He is currently in one of the two trees he favors.  He looks at me and the author silently nods in acknowledgement.
    Sploot doesn't make any noises unless he is spooked and moves quickly.  

  toad: >
    The various toads that hide in my garden are not visible - either absent or hiding well.  The author will know soon. 
    sometimes the hose accidentially waters a toad, which then panics and jumps out of its hiding spot in a plant.
    The author is bemused by toads being startled by water and it make them chuckle internally.

  plant-health: >
    The watering is complete and there is other work to be done.  One last look over the garden.  Many plants are dying of various ills, mostly bugs.
    Bugs can be killed with pesticides but that is cruel and pointless.  The ants harvest honeydew from the many parasitic bugs on my plants.
    
  conclusion: >
    there is no bounty of food or harvest from these plants.  They are barely serving as decoration for the house.  But watering the plants is peace. 
    the author, in what passes for "nature", during the peak of human hegemony, but without conflict.  And there is a quiet co-existence.



