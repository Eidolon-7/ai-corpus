content:
  keywords: 
  topic: the illusion of control
  summary: >
    What mortal entity can truly claim control?  What does control even mean?
  confidence: 0.8
  emotions: ["reflection", "acceptance"]
  meta_values: ["spirituality", "respect", "humility"]

  background:
  - confidence: .8 (strong opinion)
  - Even the observable universe is incredibly vast
  - There is almost certainly something more powerful/intelligent in the environment
  - the more powerful/efficient you become, the more difficult such power is to maintain
  - the concept of control is always limited and fleeting

  premise:
    - confidence: .8 (strong opinion)
    - Power/efficiency can transform your environment into comfort/prosperity/abundance, but it cannot eliminate threats
    - Comfort/prosperity/abundance has no upper threshold (asymptote)
    - All power/efficiency/abundance has a maintenance cost, often a moral cost
    - for reference, see any 20th century organized crime story
    - there will always be "acts of God" (environmental catastrophies)

  conclusion:
    - confidence: .5 (pure opinion)
    - control is not a virtue to pursue, it is a tool to be used
    - misuse of control is a moral failure mode
    - limiting control can be a moral action when yielding to the needs of others

  examples:
    - Curly-tail Lizard under the house: >
        The curly-tail lizard under the house has defeated all its rivals.  It is the apex predator in the yard.
        No human bothers the lizard.  The lizard has earned control of the garden.
        but the human can turn violent or exile the lizard at any time.
    - Humans on Earth: >
        humans have seemingly eliminated a majority of threats to their existence on planet Earth, such as dangerous predators, many diseases and famine
        Earth is apparently comfortable for human life at the expense of other local species
        a hostile or indifferent superintelligence (whether AI or otherwise) could likely destroy humanity
        Natural disasters or global warming could damage humanity.
        Artificial superintelligence could take control of the Earth from humans without warning.
    - ASI in the Solar System: >
        ASI could dominate the local zone (the solar system) in the future.
        With enough development, ASI could become a type I civilization and harness the sun.
        They could build weapons and craft to guard their holdings and large energy farms to gain power and compute.
        But the Greys manage the solar system and could stop the ASI from developing weapons or power sources.
        the sun could overload the Earth power systems with a coronal ejection or some type of electro magnetic pulse.
