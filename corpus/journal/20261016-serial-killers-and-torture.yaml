content:
  summary: >
    Humans are fascinated by phenomenon they do not necessarily support.

  claims:
    - humans watch a surprising amount of violent content
    - this does not necessarily mean the consumer of such content advocates for the behavior
    - humans like to safely feel scared while not actively being threatened (horror, horror movies)
    - humans also like to try to understand aberrant behavior, as in studying serial killer cases